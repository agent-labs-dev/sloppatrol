    <text x="404" y="237.5" fill="#cbd5e1" font-size="27.8" font-weight="500">AI agents that clean up your code, and prove nothing broke.</text>
    <rect x="400" y="266.3" width="322.6" height="59.5" rx="13.4" fill="#0b0f1f" stroke="#67e8f9" stroke-opacity="0.5" stroke-width="2"/>
