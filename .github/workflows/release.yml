name: Release

# One click from the Actions tab: pick the bump and this releases main. main takes only signed, reviewed PRs, so
# the release commit (version and changelog) lives only on its tag, and main's package.json can be older than it.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        type: choice
        options: [patch, minor, major]
        default: patch

permissions: {}

concurrency:
  group: sloppatrol-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Must match the environment on the npm trusted publisher. The environment allows main and v* tags.
    environment: npm
    permissions:
      contents: write # push the release tag and create the release
      id-token: write # npm trusted publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # No `version:` here: it is read from package.json's packageManager.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          # No cache in a publishing workflow: a poisoned cache would ship in the package.
          package-manager-cache: false
      # Node 24 ships npm 11, required by the trusted publisher.
      - run: npm --version
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm knip
      - run: pnpm test
      # The newest vX.Y.Z tag is the last release. The notes are the Unreleased entries that tag did not ship, so
      # entries stay under Unreleased on main and are never released twice.
      - name: Set the version and changelog
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail
          last=$(git tag --list 'v*.*.*' --sort=-v:refname | head -n 1)
          npm version "${last#v}" --no-git-tag-version --allow-same-version
          npm version "$BUMP" --no-git-tag-version
          version=$(jq -r .version package.json)
          python3 - "$last" "$version" "$(date -u +%F)" "$RUNNER_TEMP/notes.md" <<'PY'
          import re, subprocess, sys
          last, version, date, notes_path = sys.argv[1:]
          shipped = set(subprocess.run(["git", "show", f"{last}:CHANGELOG.md"], capture_output=True, text=True, check=True).stdout.splitlines())
          head, found, rest = open("CHANGELOG.md").read().partition("## [Unreleased]\n")
          if not found:
              sys.exit("CHANGELOG.md has no ## [Unreleased] heading")
          older = re.search(r"^## \[", rest, re.M)
          unreleased, older = (rest[: older.start()], rest[older.start() :]) if older else (rest, "")
          sections, keep = [], False
          for line in unreleased.splitlines():
              if line.startswith("### "):
                  sections.append((line, []))
              elif line.startswith("- "):
                  if not sections:
                      sys.exit(f"An Unreleased entry has no ### heading: {line}")
                  keep = line not in shipped
                  if keep:
                      sections[-1][1].append(line)
              elif line.strip() and keep:
                  sections[-1][1].append(line)
          notes = "\n\n".join(heading + "\n\n" + "\n".join(lines) for heading, lines in sections if lines)
          if not notes:
              sys.exit(f"Nothing under ## [Unreleased] is new since {last}")
          open(notes_path, "w").write(notes + "\n")
          open("CHANGELOG.md", "w").write(f"{head}## [Unreleased]\n\n## [{version}] - {date}\n\n{notes}\n\n{older}")
          PY
          cat "$RUNNER_TEMP/notes.md"
          echo "value=$version" >> "$GITHUB_OUTPUT"
      - run: pnpm build
      - name: Smoke test package
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          test "$(node dist/cli/index.js --version)" = "$VERSION"
          node dist/cli/index.js --help
          # The dashboard serves ui/ and the roles read playbook/: both must ship.
          npm pack --dry-run --json | node -e "
            const files = JSON.parse(require('fs').readFileSync(0, 'utf8'))[0].files.map((f) => f.path);
            for (const need of ['dist/cli/index.js', 'ui/index.html', 'playbook/principles.md'])
              if (!files.includes(need)) throw new Error('The package is missing ' + need);
            if (files.some((f) => f.includes('/tests/'))) throw new Error('The package ships tests');
          "
      # No token: npm trusts this workflow through OIDC (id-token: write) and attaches provenance on its own.
      # A rerun after a failed tag push finds the same version (no tag yet) already on npm and skips it.
      - name: Publish to npm
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          if npm view "sloppatrol@$VERSION" version >/dev/null 2>&1; then
            echo "sloppatrol@$VERSION is already on npm"
          else
            npm publish
          fi
      - name: Tag and release
        env:
          VERSION: ${{ steps.version.outputs.value }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json CHANGELOG.md
          git -c core.hooksPath=/dev/null commit -m "release: sloppatrol v$VERSION"
          git tag -a "v$VERSION" -m "sloppatrol v$VERSION"
          git push "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git" "v$VERSION"
          gh release create "v$VERSION" --verify-tag --title "v$VERSION" --notes-file "$RUNNER_TEMP/notes.md"
