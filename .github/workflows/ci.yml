name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # No `version:` here: it is read from package.json's packageManager.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm knip
      - run: pnpm build
      - run: node dist/cli/index.js --version
      - run: pnpm test

  # The vendored project-rules tools: stdlib Python, tested on the oldest and newest supported versions.
  tools:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked --group dev
      - run: uv run --no-sync ruff check skills/sloppatrol/scripts tests/python
      - run: uv run --no-sync ruff format --check skills/sloppatrol/scripts tests/python
      - run: uv run --no-sync pytest tests/python -q
      - run: python skills/sloppatrol/scripts/agents.py check
      # The gate on this repository itself, through the action users call.
      - uses: ./
        with:
          base: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || 'HEAD~1' }}
          gate: skills/sloppatrol/scripts/gate.py
          agents-check: "false"
