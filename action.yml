name: Sloppatrol project rules
description: Run the repository's vendored Sloppatrol gate over the change, with GitHub annotations on each finding.
inputs:
  base:
    description: The ref the change is compared with. Defaults to the pull request's base branch, or the default branch.
    default: ""
  python-version:
    description: The Python the gate runs on (3.10 or later).
    default: "3.13"
  ast-grep-version:
    description: The ast-grep CLI installed when the repository has ast-grep rules.
    default: "0.44.1"
  gate:
    description: The gate to run. Sloppatrol's own CI points it at the copy it ships.
    default: .sloppatrol/gate.py
  agents-check:
    description: Also run `.sloppatrol/agents.py check` when the repository vendors it.
    default: "true"
runs:
  using: composite
  steps:
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: ${{ inputs.python-version }}
    - name: Install ast-grep
      if: hashFiles('.sloppatrol/sgconfig.yml') != ''
      shell: bash
      env:
        AST_GREP_VERSION: ${{ inputs.ast-grep-version }}
      run: python -m pip install --disable-pip-version-check --quiet "ast-grep-cli==$AST_GREP_VERSION"
    - name: AGENTS.md check
      if: inputs.agents-check == 'true' && hashFiles('.sloppatrol/agents.py') != ''
      shell: bash
      run: python .sloppatrol/agents.py check
    - name: Project rules
      shell: bash
      env:
        BASE: ${{ inputs.base || format('origin/{0}', github.base_ref || github.event.repository.default_branch) }}
        GATE: ${{ inputs.gate }}
      run: |
        if [ "$(git rev-parse --is-shallow-repository)" = true ]; then
          echo "::error title=Shallow checkout::The gate compares with $BASE and needs full history: set fetch-depth: 0 on actions/checkout."
          exit 2
        fi
        python "$GATE" --base "$BASE"
