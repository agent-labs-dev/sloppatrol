[project]
name = "sloppatrol-python"
version = "0.1.0"
requires-python = ">=3.10"

[dependency-groups]
dev = ["ast-grep-cli==0.44.1", "pytest>=8", "ruff", "ty"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests/python"]

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = [".sloppatrol/script-tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "PL"]
ignore = ["PLR2004"]

[tool.ty.src]
exclude = [".sloppatrol/script-tests"]

[tool.ty.environment]
extra-paths = ["skills/sloppatrol/scripts"]
