<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sloppatrol</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <header class="top">
      <div class="brand">
        <span class="logo" aria-hidden="true">◆</span>
        <span class="name">sloppatrol</span>
        <span class="project" id="project"></span>
      </div>
      <div class="meta" id="meta"></div>
    </header>

    <section class="lanes" id="lanes" aria-label="Agents"></section>
    <section class="stats" id="stats" aria-label="Totals"></section>

    <nav class="tabs" aria-label="Views">
      <a href="#refactors" data-tab="refactors">Refactors</a>
      <a href="#scorecard" data-tab="scorecard">Scorecard</a>
      <a href="#checks" data-tab="checks">Checks</a>
      <a href="#backlog" data-tab="backlog">Backlog</a>
      <a href="#sessions" data-tab="sessions">Sessions</a>
    </nav>

    <div class="layout">
      <main id="view" aria-live="polite"></main>
      <aside id="detail" class="detail" hidden></aside>
    </div>

    <script src="/app.js" type="module"></script>
  </body>
</html>
